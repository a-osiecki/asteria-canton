<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asteria Explorer</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --border: #2a2f3a;
        --text: #d7dae0;
        --muted: #8b93a1;
        --accent: #7aa2f7;
        --green: #9ece6a;
        --orange: #ff9e64;
        --red: #f7768e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.5;
      }
      header {
        position: sticky;
        top: 0;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        padding: 10px 16px;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      h1 { font-size: 15px; margin: 0 12px 0 0; color: var(--accent); }
      select, button {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
      }
      button { cursor: pointer; }
      #status { color: var(--muted); margin-left: auto; }
      main { padding: 16px; max-width: 1100px; margin: 0 auto; }
      .update {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        margin-bottom: 12px;
        overflow: hidden;
      }
      .update-head {
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .update-head .offset { color: var(--orange); }
      .update-head .id { color: var(--muted); overflow-wrap: anywhere; }
      .events { padding: 4px 12px 10px; }
      .ev { padding: 6px 0; border-bottom: 1px dashed var(--border); }
      .ev:last-child { border-bottom: none; }
      .ev .kind { font-weight: bold; }
      .ev.created .kind { color: var(--green); }
      .ev.exercised .kind { color: var(--accent); }
      .ev.archived .kind { color: var(--red); }
      .ev .row { color: var(--muted); overflow-wrap: anywhere; }
      .ev .row b { color: var(--text); font-weight: normal; }
      details { margin: 4px 0 2px; }
      summary { cursor: pointer; color: var(--accent); }
      pre {
        background: #0b0d11;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 8px;
        margin: 4px 0;
        overflow-x: auto;
        color: #c8ccd4;
        max-height: 420px;
      }
      .empty { color: var(--muted); text-align: center; padding: 40px; }
      .error { color: var(--red); padding: 12px; }
      .badge {
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 0 5px;
        font-size: 11px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Asteria Explorer</h1>
      <select id="party"></select>
      <button id="refresh">Refrescar</button>
      <label><input type="checkbox" id="auto" checked /> auto (5s)</label>
      <span id="status">iniciando...</span>
    </header>
    <main id="updates"></main>

    <script>
      const AUDIENCE = "https://canton.network.global";
      const USER = "ledger-api-user";
      const SECRET = "unsafe";
      const MAX_PAGE_SIZE = 50;
      const PARTY_PREFIX = "asteria-";

      const statusEl = document.getElementById("status");
      const updatesEl = document.getElementById("updates");
      const partyEl = document.getElementById("party");
      const autoEl = document.getElementById("auto");

      let token = "";

      function base64url(bytes) {
        let binary = "";
        for (const b of bytes) binary += String.fromCharCode(b);
        return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      }

      async function makeToken() {
        const enc = new TextEncoder();
        const header = base64url(enc.encode(JSON.stringify({ alg: "HS256", typ: "JWT" })));
        const payload = base64url(enc.encode(JSON.stringify({ sub: USER, aud: AUDIENCE })));
        const signing = `${header}.${payload}`;
        const key = await crypto.subtle.importKey(
          "raw",
          enc.encode(SECRET),
          { name: "HMAC", hash: "SHA-256" },
          false,
          ["sign"],
        );
        const signature = await crypto.subtle.sign("HMAC", key, enc.encode(signing));
        return `${signing}.${base64url(new Uint8Array(signature))}`;
      }

      async function api(path, body) {
        const response = await fetch(path, {
          method: body === undefined ? "GET" : "POST",
          headers: {
            Authorization: `Bearer ${token}`,
            ...(body === undefined ? {} : { "Content-Type": "application/json" }),
          },
          body: body === undefined ? undefined : JSON.stringify(body),
        });
        if (!response.ok) {
          throw new Error(`${path} -> HTTP ${response.status}: ${(await response.text()).slice(0, 300)}`);
        }
        return response.json();
      }

      function esc(value) {
        return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function shortParty(party) {
        return String(party).split("::")[0];
      }

      function json(label, value) {
        if (value === undefined || value === null) return "";
        return `<details><summary>${esc(label)}</summary><pre>${esc(JSON.stringify(value, null, 2))}</pre></details>`;
      }

      function parties(list) {
        return (list ?? []).map(shortParty).join(", ");
      }

      function eventHtml(event) {
        const created = event.CreatedEvent;
        if (created) {
          return `<div class="ev created">
            <div class="kind">+ create ${esc(created.templateId)}</div>
            <div class="row">cid <b>${esc(created.contractId)}</b></div>
            <div class="row">signatories <b>${esc(parties(created.signatories))}</b> | observers <b>${esc(parties(created.observers))}</b></div>
            ${json("createArgument (datum)", created.createArgument)}
          </div>`;
        }
        const exercised = event.ExercisedEvent;
        if (exercised) {
          return `<div class="ev exercised">
            <div class="kind">> exercise ${esc(exercised.templateId)} <b>${esc(exercised.choice)}</b>
              ${exercised.consuming ? '<span class="badge">consuming</span>' : ""}</div>
            <div class="row">acting <b>${esc(parties(exercised.actingParties))}</b> | cid <b>${esc(exercised.contractId)}</b></div>
            ${json("choiceArgument", exercised.choiceArgument)}
            ${json("exerciseResult", exercised.exerciseResult)}
          </div>`;
        }
        const archived = event.ArchivedEvent;
        if (archived) {
          return `<div class="ev archived">
            <div class="kind">- archive ${esc(archived.templateId)}</div>
            <div class="row">cid <b>${esc(archived.contractId)}</b></div>
          </div>`;
        }
        return `<div class="ev"><pre>${esc(JSON.stringify(event, null, 2))}</pre></div>`;
      }

      function updateHtml(update) {
        const envelope = update.update ?? update;
        const transaction = (envelope.Transaction ?? envelope.transaction ?? {}).value ?? envelope.Transaction ?? envelope.transaction;
        if (!transaction || !transaction.events) {
          return `<div class="update"><div class="update-head">otro update</div>
            <div class="events">${json("raw", envelope)}</div></div>`;
        }
        const events = (transaction.events ?? []).map(eventHtml).join("");
        return `<div class="update">
          <div class="update-head">
            <span class="offset">offset ${esc(transaction.offset)}</span>
            <span>${esc(transaction.recordTime ?? transaction.effectiveAt ?? "")}</span>
            <span class="id">${esc(transaction.updateId)}</span>
          </div>
          <div class="events">${events}</div>
        </div>`;
      }

      async function loadParties() {
        const data = await api("/v2/parties");
        const options = (data.partyDetails ?? [])
          .filter((party) => String(party.party).startsWith(PARTY_PREFIX))
          .map((party) => `<option value="${esc(party.party)}">${esc(shortParty(party.party))}</option>`);
        if (options.length === 0) throw new Error(`no hay parties con prefijo ${PARTY_PREFIX}`);
        partyEl.innerHTML = options.join("");
        const pilot = [...partyEl.options].find((option) => option.text.startsWith("asteria-pilot"));
        if (pilot) partyEl.value = pilot.value;
      }

      async function load() {
        statusEl.textContent = "cargando...";
        try {
          const party = partyEl.value;
          const body = {
            updateFormat: {
              includeTransactions: {
                transactionShape: "TRANSACTION_SHAPE_LEDGER_EFFECTS",
                eventFormat: {
                  filtersByParty: {
                    [party]: { cumulative: [{ identifierFilter: { WildcardFilter: { value: {} } } }] },
                  },
                  verbose: true,
                },
              },
            },
            maxPageSize: MAX_PAGE_SIZE,
            descendingOrder: true,
          };
          const page = await api("/v2/updates/get-updates-page", body);
          const updates = page.updates ?? [];
          updatesEl.innerHTML = updates.length === 0
            ? '<div class="empty">sin transacciones para esta party</div>'
            : updates.map(updateHtml).join("");
          statusEl.textContent = `${updates.length} updates | offset ${page.highestPageOffsetInclusive ?? "?"}`;
        } catch (error) {
          updatesEl.innerHTML = `<div class="error">${esc(error.message)}</div>`;
          statusEl.textContent = "error";
        }
      }

      let timer = undefined;
      function schedule() {
        if (timer) clearInterval(timer);
        if (autoEl.checked) timer = setInterval(load, 5000);
      }

      (async () => {
        try {
          if (!crypto.subtle) throw new Error("crypto.subtle no disponible: usá https o localhost");
          token = await makeToken();
          await loadParties();
          await load();
          partyEl.addEventListener("change", load);
          document.getElementById("refresh").addEventListener("click", load);
          autoEl.addEventListener("change", schedule);
          schedule();
        } catch (error) {
          updatesEl.innerHTML = `<div class="error">${esc(error.message)}</div>`;
          statusEl.textContent = "error";
        }
      })();
    </script>
  </body>
</html>
