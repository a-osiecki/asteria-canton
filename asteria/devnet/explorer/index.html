<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asteria Explorer</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --box: #0b0d11;
        --border: #2a2f3a;
        --text: #d7dae0;
        --muted: #8b93a1;
        --accent: #7aa2f7;
        --green: #9ece6a;
        --orange: #ff9e64;
        --red: #f7768e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.5;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        padding: 10px 16px;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      h1 { font-size: 15px; margin: 0 12px 0 0; color: var(--accent); }
      select, button {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
      }
      button { cursor: pointer; }
      #status { color: var(--muted); margin-left: auto; }
      main { padding: 16px; max-width: 1200px; margin: 0 auto; }
      .update {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        margin-bottom: 14px;
        overflow: hidden;
      }
      .update-head {
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        align-items: baseline;
      }
      .update-head .offset { color: var(--orange); }
      .update-head .id { color: var(--muted); overflow-wrap: anywhere; font-size: 12px; }
      .flow {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 36px minmax(0, 1fr);
        gap: 8px;
        padding: 10px 12px;
        align-items: start;
      }
      .col-title {
        color: var(--muted);
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }
      .arrow { text-align: center; color: var(--muted); padding-top: 26px; font-size: 16px; }
      .box {
        background: var(--box);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 8px;
        margin-bottom: 8px;
      }
      .box.input { border-left: 3px solid var(--red); }
      .box.output { border-left: 3px solid var(--green); }
      .box.action { border-left: 3px solid var(--accent); }
      .box-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
      .box .tmpl { font-weight: bold; }
      .box.input .tmpl { color: var(--red); }
      .box.output .tmpl { color: var(--green); }
      .box.action .tmpl { color: var(--accent); }
      .box .row { color: var(--muted); overflow-wrap: anywhere; }
      .box .row b { color: var(--text); font-weight: normal; }
      .cid { color: var(--orange); cursor: help; }
      .placeholder { color: var(--muted); border: 1px dashed var(--border); border-radius: 5px; padding: 12px; text-align: center; }
      details { margin: 4px 0 2px; }
      summary { cursor: pointer; color: var(--accent); }
      pre {
        background: #06080b;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 8px;
        margin: 4px 0;
        overflow-x: auto;
        color: #c8ccd4;
        max-height: 420px;
      }
      .empty { color: var(--muted); text-align: center; padding: 40px; }
      .error { color: var(--red); padding: 12px; }
      .badge {
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 0 5px;
        font-size: 11px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Asteria Explorer</h1>
      <select id="party"></select>
      <button id="refresh">Refrescar</button>
      <label><input type="checkbox" id="auto" checked /> auto (5s)</label>
      <span id="status">iniciando...</span>
    </header>
    <main id="updates"></main>

    <script>
      const AUDIENCE = "https://canton.network.global";
      const USER = "ledger-api-user";
      const SECRET = "unsafe";
      const MAX_PAGE_SIZE = 50;
      const PARTY_PREFIX = "asteria-";

      const statusEl = document.getElementById("status");
      const updatesEl = document.getElementById("updates");
      const partyEl = document.getElementById("party");
      const autoEl = document.getElementById("auto");

      let token = "";

      function base64url(bytes) {
        let binary = "";
        for (const b of bytes) binary += String.fromCharCode(b);
        return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      }

      async function makeToken() {
        const enc = new TextEncoder();
        const header = base64url(enc.encode(JSON.stringify({ alg: "HS256", typ: "JWT" })));
        const payload = base64url(enc.encode(JSON.stringify({ sub: USER, aud: AUDIENCE })));
        const signing = `${header}.${payload}`;
        const key = await crypto.subtle.importKey(
          "raw",
          enc.encode(SECRET),
          { name: "HMAC", hash: "SHA-256" },
          false,
          ["sign"],
        );
        const signature = await crypto.subtle.sign("HMAC", key, enc.encode(signing));
        return `${signing}.${base64url(new Uint8Array(signature))}`;
      }

      async function api(path, body) {
        const response = await fetch(path, {
          method: body === undefined ? "GET" : "POST",
          headers: {
            Authorization: `Bearer ${token}`,
            ...(body === undefined ? {} : { "Content-Type": "application/json" }),
          },
          body: body === undefined ? undefined : JSON.stringify(body),
        });
        if (!response.ok) {
          throw new Error(`${path} -> HTTP ${response.status}: ${(await response.text()).slice(0, 300)}`);
        }
        return response.json();
      }

      function esc(value) {
        return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function shortParty(party) {
        return String(party).split("::")[0];
      }

      function parties(list) {
        const names = (list ?? []).map(shortParty);
        return names.length === 0 ? "—" : names.join(", ");
      }

      function templateName(templateId) {
        const parts = String(templateId).split(":");
        return parts[parts.length - 1];
      }

      function cid(value) {
        const text = String(value);
        return `<span class="cid" title="${esc(text)}">${esc(text.slice(0, 14))}…</span>`;
      }

      function json(label, value) {
        if (value === undefined || value === null) return "";
        return `<details><summary>${esc(label)}</summary><pre>${esc(JSON.stringify(value, null, 2))}</pre></details>`;
      }

      function resultRow(value) {
        if (value === undefined || value === null) return "";
        if (typeof value === "string") return `<div class="row">result <b>${cid(value)}</b></div>`;
        return json("exerciseResult", value);
      }

      function inputBox(event) {
        return `<div class="box input">
          <div class="box-head">
            <span class="tmpl">- ${esc(templateName(event.templateId))}</span>
            <span class="badge">${esc(event.choice)}</span>
          </div>
          <div class="row">cid ${cid(event.contractId)}</div>
          <div class="row">acting <b>${esc(parties(event.actingParties))}</b></div>
          ${json("choiceArgument", event.choiceArgument)}
          ${resultRow(event.exerciseResult)}
        </div>`;
      }

      function archiveBox(event) {
        return `<div class="box input">
          <div class="box-head">
            <span class="tmpl">- ${esc(templateName(event.templateId))}</span>
            <span class="badge">archive</span>
          </div>
          <div class="row">cid ${cid(event.contractId)}</div>
        </div>`;
      }

      function outputBox(event) {
        return `<div class="box output">
          <div class="box-head"><span class="tmpl">+ ${esc(templateName(event.templateId))}</span></div>
          <div class="row">cid ${cid(event.contractId)}</div>
          <div class="row">signatories <b>${esc(parties(event.signatories))}</b></div>
          <div class="row">observers <b>${esc(parties(event.observers))}</b></div>
          ${json("createArgument (datum)", event.createArgument)}
        </div>`;
      }

      function actionBox(event) {
        return `<div class="box action">
          <div class="box-head">
            <span class="tmpl">${esc(templateName(event.templateId))}</span>
            <span class="badge">${esc(event.choice)} no consuming</span>
          </div>
          <div class="row">cid ${cid(event.contractId)}</div>
          <div class="row">acting <b>${esc(parties(event.actingParties))}</b></div>
          ${json("choiceArgument", event.choiceArgument)}
          ${resultRow(event.exerciseResult)}
        </div>`;
      }

      function updateHtml(update) {
        const envelope = update.update ?? update;
        const wrapped = envelope.Transaction ?? envelope.transaction;
        const transaction = wrapped?.value ?? wrapped;
        if (!transaction || !transaction.events) {
          return `<div class="update">
            <div class="update-head"><span class="id">update sin transacción Daml</span></div>
            <div class="flow" style="grid-template-columns: 1fr">${json("raw", envelope)}</div>
          </div>`;
        }
        const events = transaction.events ?? [];
        const created = events.filter((event) => event.CreatedEvent).map((event) => event.CreatedEvent);
        const exercised = events.filter((event) => event.ExercisedEvent).map((event) => event.ExercisedEvent);
        const archived = events.filter((event) => event.ArchivedEvent).map((event) => event.ArchivedEvent);
        const consumed = exercised.filter((event) => event.consuming);
        const actions = exercised.filter((event) => !event.consuming);

        const inputs = [...consumed.map(inputBox), ...archived.map(archiveBox)].join("") ||
          '<div class="placeholder">sin contratos consumidos</div>';
        const outputs = created.map(outputBox).join("") ||
          '<div class="placeholder">sin contratos creados</div>';
        const actionsHtml = actions.length === 0
          ? ""
          : `<div class="flow" style="grid-template-columns: 1fr">
              <div>
                <div class="col-title">Acciones no consumidoras</div>
                ${actions.map(actionBox).join("")}
              </div>
            </div>`;

        return `<div class="update">
          <div class="update-head">
            <span class="offset">offset ${esc(transaction.offset)}</span>
            <span>${esc(transaction.recordTime ?? transaction.effectiveAt ?? "")}</span>
            <span class="id">${esc(transaction.updateId)}</span>
          </div>
          <div class="flow">
            <div>
              <div class="col-title">Contratos consumidos (inputs)</div>
              ${inputs}
            </div>
            <div class="arrow">→</div>
            <div>
              <div class="col-title">Contratos creados (outputs)</div>
              ${outputs}
            </div>
          </div>
          ${actionsHtml}
        </div>`;
      }

      function preferredParty() {
        const requested = new URLSearchParams(window.location.search).get("party");
        const options = [...partyEl.options];
        const match = options.find((option) => option.text === requested || option.value === requested);
        if (match) return match.value;
        const preferred =
          options.find((option) => option.text.startsWith("asteria-pilot-1")) ??
          options.find((option) => option.text.startsWith("asteria-pilot"));
        return preferred?.value ?? options[0]?.value;
      }

      async function loadParties() {
        const data = await api("/v2/parties");
        const options = (data.partyDetails ?? [])
          .filter((party) => String(party.party).startsWith(PARTY_PREFIX))
          .map((party) => `<option value="${esc(party.party)}">${esc(shortParty(party.party))}</option>`);
        if (options.length === 0) throw new Error(`no hay parties con prefijo ${PARTY_PREFIX}`);
        partyEl.innerHTML = options.join("");
        partyEl.value = preferredParty();
      }

      function selectParty(party) {
        const url = new URL(window.location.href);
        url.searchParams.set("party", shortParty(party));
        history.replaceState(null, "", url);
      }

      async function load() {
        statusEl.textContent = "cargando...";
        try {
          const party = partyEl.value;
          const body = {
            updateFormat: {
              includeTransactions: {
                transactionShape: "TRANSACTION_SHAPE_LEDGER_EFFECTS",
                eventFormat: {
                  filtersByParty: {
                    [party]: { cumulative: [{ identifierFilter: { WildcardFilter: { value: {} } } }] },
                  },
                  verbose: true,
                },
              },
            },
            maxPageSize: MAX_PAGE_SIZE,
            descendingOrder: true,
          };
          const page = await api("/v2/updates/get-updates-page", body);
          const updates = page.updates ?? [];
          document.title = `Asteria Explorer - ${shortParty(party)}`;
          updatesEl.innerHTML = updates.length === 0
            ? '<div class="empty">sin transacciones para esta party</div>'
            : updates.map(updateHtml).join("");
          statusEl.textContent = `${updates.length} updates para ${shortParty(party)} | offset ${page.highestPageOffsetInclusive ?? "?"}`;
        } catch (error) {
          updatesEl.innerHTML = `<div class="error">${esc(error.message)}</div>`;
          statusEl.textContent = "error";
        }
      }

      let timer = undefined;
      function schedule() {
        if (timer) clearInterval(timer);
        if (autoEl.checked) timer = setInterval(load, 5000);
      }

      (async () => {
        try {
          if (!crypto.subtle) throw new Error("crypto.subtle no disponible: usá https o localhost");
          token = await makeToken();
          await loadParties();
          await load();
          partyEl.addEventListener("change", () => {
            selectParty(partyEl.value);
            load();
          });
          document.getElementById("refresh").addEventListener("click", load);
          autoEl.addEventListener("change", schedule);
          schedule();
        } catch (error) {
          updatesEl.innerHTML = `<div class="error">${esc(error.message)}</div>`;
          statusEl.textContent = "error";
        }
      })();
    </script>
  </body>
</html>
